name: Video yaratish va YouTube'ga yuklash

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Video turi"
        type: choice
        options: [short, long]
        default: short
      dry_run:
        description: "Sinov rejimi (YouTube'ga yuklamaydi)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg o'rnatish
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Video yaratish
        env:
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 12 * * 0' && 'long' || 'short') }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          PRIVACY: ${{ vars.PRIVACY || 'private' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py

      - name: Videoni saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/video.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Ishlatilgan mavzularni yozib qo'yish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add used_topics.json || true
          git diff --cached --quiet || (git commit -m "mavzular yangilandi" && git pull --rebase && git push)
