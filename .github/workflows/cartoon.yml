name: Cartoon (Rainbow Friends)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install edge-tts
      - name: Build
        run: |
          set -o pipefail
          mkdir -p cartoon/out
          python -u cartoon/build.py 2>&1 | tee cartoon/out/log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rainbow_friends
          path: cartoon/out/rainbow_friends.mp4
      - name: Save result into repo
        if: always()
        run: |
          git config user.name "cartoon-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f cartoon/out/
          git commit -m "Rainbow Friends: tayyor multfilm" || echo "no change"
          git push
